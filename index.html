<!doctype html>
<html lang="en" data-theme="reactor">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JARVIS</title>
  <meta name="description" content="JARVIS: a free, private AI assistant that runs on your own computer.">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http: https:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#040a17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="grid-lines"></div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
  </div>

  <div class="app" id="app">
    <!-- Sidebar: brand, conversations, navigation -->
    <aside class="sidebar glass" id="sidebar" aria-label="Conversations">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span></div>
        <div class="brand-text">
          <div class="brand-name" id="brandName">JARVIS</div>
          <div class="brand-sub">Local AI assistant</div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="newChatBtn" type="button" data-icon="plus">New conversation</button>
      <label class="search">
        <span class="search-icon" data-icon="search"></span>
        <input id="searchInput" type="search" placeholder="Search conversations" aria-label="Search conversations" autocomplete="off">
      </label>
      <nav class="session-list" id="sessionList" aria-label="Conversation history"></nav>
      <div class="side-nav">
        <button class="nav-btn" type="button" data-open="lists" data-icon="list">Lists</button>
        <button class="nav-btn" type="button" data-open="workout" data-icon="zap">Workouts</button>
        <button class="nav-btn" type="button" data-open="plugins" data-icon="puzzle">Plugins</button>
        <button class="nav-btn" type="button" data-open="models" data-icon="layers">Models</button>
        <button class="nav-btn" type="button" data-open="memory" data-icon="brain">Memory</button>
        <button class="nav-btn" type="button" data-open="general" data-icon="gear">Settings</button>
      </div>
    </aside>

    <!-- Main column -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn" id="sidebarToggle" type="button" title="Show or hide conversations" aria-label="Show or hide conversations" data-icon="sidebar"></button>
        <div class="title-wrap">
          <input class="session-title" id="sessionTitle" value="New conversation" aria-label="Conversation title" spellcheck="false">
        </div>
        <button class="model-chip" id="modelChip" type="button" title="Choose AI model">
          <span class="dot" id="modelDot"></span>
          <span id="modelChipText">Checking AI engine…</span>
          <span class="chev" data-icon="chevron"></span>
        </button>
        <button class="icon-btn" id="shareBtn" type="button" title="Share JARVIS" aria-label="Share JARVIS" data-icon="share"></button>
        <button class="icon-btn" id="speakToggle" type="button" title="Spoken replies" aria-label="Spoken replies" data-icon="speaker"></button>
        <button class="icon-btn" id="hudToggle" type="button" title="Show or hide status panel" aria-label="Show or hide status panel" data-icon="panel"></button>
      </header>

      <section class="stage" id="stage">
        <div class="orb-wrap" id="orbWrap">
          <canvas id="visualizer" aria-hidden="true"></canvas>
          <button class="orb-hit" id="orbHit" type="button" aria-label="Talk to JARVIS"></button>
        </div>
        <div class="orb-status" id="orbStatus" aria-live="polite">Standing by</div>
        <div class="partial" id="partial" hidden></div>
        <div class="welcome" id="welcome">
          <h1 class="greeting" id="greeting">Good evening.</h1>
          <p class="greeting-sub" id="greetingSub">How can I help you today?</p>
          <div class="suggestions" id="suggestions"></div>
          <div class="today" id="today"></div>
        </div>
      </section>

      <section class="transcript" id="transcript" aria-live="polite" aria-label="Conversation"></section>

      <footer class="composer-wrap">
        <div class="slash-menu glass" id="slashMenu" hidden></div>
        <div class="pending" id="pending" hidden></div>
        <div class="composer glass" id="composer">
          <button class="icon-btn" id="attachBtn" type="button" title="Add a document or picture" aria-label="Add a document or picture" data-icon="paperclip"></button>
          <button class="icon-btn" id="lookBtn" type="button" title="What’s this? Point at something on your screen" aria-label="Identify something on your screen" data-icon="eye"></button>
          <textarea id="input" rows="1" placeholder="Message JARVIS, or type / for skills" aria-label="Message JARVIS"></textarea>
          <button class="mic-btn" id="micBtn" type="button" title="Talk to JARVIS" aria-label="Talk to JARVIS" data-icon="mic"></button>
          <button class="send-btn" id="sendBtn" type="button" title="Send" aria-label="Send" data-icon="send"></button>
        </div>
        <div class="composer-hint" id="composerHint">Runs on your computer. Speed depends on your device.</div>
      </footer>
    </main>

    <!-- Status panel -->
    <aside class="hud" id="hud" aria-label="Status"></aside>
  </div>

  <div class="sheet-layer" id="sheetLayer" hidden></div>
  <div class="wizard-layer" id="wizardLayer" hidden></div>
  <div class="install-hint glass" id="installHint" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="popover glass" id="popover" hidden></div>
</body>
</html>
